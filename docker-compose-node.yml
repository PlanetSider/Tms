services:
  node:
    # 可选修改：需要使用私有镜像或固定版本时，在 .env 中设置 TMS_NODE_IMAGE。
    image: ${TMS_NODE_IMAGE:-ghcr.io/planetsider/tms-node:latest}
    restart: unless-stopped
    init: true
    network_mode: host
    stop_grace_period: 30s
    environment:
      # 必须修改：面板后端公网地址；IPv6 地址请使用 [地址]:端口 格式。
      TMS_PANEL_ADDR: ${TMS_PANEL_ADDR:?TMS_PANEL_ADDR is required}
      # 必须修改：从面板“转发机监控”生成的节点密钥。
      TMS_NODE_SECRET: ${TMS_NODE_SECRET:?TMS_NODE_SECRET is required}
      TMS_AGENT_CONFIG: /etc/gost/config.json
      SINGBOX_BIN: /usr/local/bin/sing-box
      SINGBOX_RUNTIME_DOWNLOAD: "false"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x tms-node >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./data:/etc/gost
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
