# 合体面板(协议+限速)测试用 compose。
# 【本地 build 源码镜像,不拉 :latest,不碰生产】,MySQL 初始化时连 hybrid schema 一起建。
#
# 用法(在一台【干净的测试机】上,别和生产面板同机跑,否则容器名/端口冲突):
#   1) 下源码:curl -L https://github.com/PlanetSider/Tms/archive/refs/heads/main.tar.gz | tar xz && cd Tms-main
#   2) 建 .env(见文件末尾示例)
#   3) docker compose -f docker-compose-hybrid.yml --env-file .env up -d --build
#      (第一次会本地编译前后端,几分钟)
#   4) 浏览器开 http://测试机IP:${FRONTEND_PORT},默认 admin_user/admin_user
#
# 部署前必须在同目录 .env 中填写 DB_NAME、DB_USER、DB_PASSWORD 和 JWT_SECRET；
# 端口冲突时修改 FRONTEND_PORT 或 BACKEND_PORT。下方注释中的 gost/636x 为示例值。
services:
  mysql:
    # MySQL 8.0 官方镜像同时支持 AMD64 和 ARM64；从 5.7 升级前请先备份 ./data/mysql。
    image: mysql:8.0
    container_name: gost-mysql
    restart: unless-stopped
    environment:
      # 必须与 backend 的 DB_* 和 .env 中的数据库配置一致。
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required} # 必须修改：与 .env 的 DB_PASSWORD 一致。
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required} # 必须修改：与 backend 的 DB_NAME 一致。
      MYSQL_USER: ${DB_USER:?DB_USER is required} # 必须修改：与 backend 的 DB_USER 一致。
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required} # 必须修改：与 MYSQL_ROOT_PASSWORD 一致。
      TZ: Asia/Shanghai
    volumes:
      - ./data/mysql:/var/lib/mysql
      # gost.sql 已包含全部 hybrid 表(协议/中转/线路),不要再挂 hybrid-schema-*.sql,
      # 否则里面的 ALTER TABLE 会二次执行报 1060,导致 MySQL 初始化中断。
      # 那三个文件保留着,供【已有旧库】单独执行升级用。
      - ./gost.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=1000
      --innodb_buffer_pool_size=256M
    networks:
      - gost-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  backend:
    build:
      context: ./springboot-backend
      dockerfile: Dockerfile
    image: tms-backend:hybrid
    container_name: springboot-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      # 以下 DB_*、JWT_SECRET 必须与 .env 中的配置一致。
      DB_NAME: ${DB_NAME:?DB_NAME is required} # 必须修改：填写 .env 中的数据库名（示例 gost）。
      DB_USER: ${DB_USER:?DB_USER is required} # 必须修改：填写 .env 中的数据库用户（示例 gost）。
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required} # 必须修改：填写 .env 中的数据库密码。
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required} # 必须修改：填写随机长字符串。
      LOG_DIR: /app/logs
      JAVA_OPTS: "-Xms256m -Xmx512m -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai"
    ports:
      # 可修改左侧宿主机端口；右侧 6365 是容器端口，不要修改。
      - "${BACKEND_PORT:-6365}:6365"
    volumes:
      - ./logs/backend:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gost-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:6365/flow/test"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: ./vite-frontend
      dockerfile: Dockerfile
    image: tms-frontend:hybrid
    container_name: vite-frontend
    restart: unless-stopped
    ports:
      # 可修改左侧宿主机端口；右侧 80 是容器端口，不要修改。
      - "${FRONTEND_PORT:-6366}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gost-network

networks:
  gost-network:
    name: gost-network
    driver: bridge

# --- .env 示例(存成同目录 .env)---
# DB_NAME=gost                 # 必须填写；可按需修改数据库名称
# DB_USER=gost                 # 必须填写；可按需修改数据库用户
# DB_PASSWORD=换个强密码       # 必须填写随机强密码
# JWT_SECRET=换一串随机长字符串 # 必须填写随机长字符串
# BACKEND_PORT=6365            # 可修改宿主机端口
# FRONTEND_PORT=6366           # 可修改宿主机端口
