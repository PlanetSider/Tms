x-tms-config:
  # 可选修改：数据库名称；必须与后端 DB_NAME 保持一致（默认 gost）。
  db-name: &tms-db-name "gost" # TMS_DB_NAME
  # 可选修改：数据库用户名；必须与后端 DB_USER 保持一致（默认 gost）。
  db-user: &tms-db-user "gost" # TMS_DB_USER
  # 必须修改：填写随机强密码；MySQL 和后端会共用这个值。
  db-password: &tms-db-password "" # TMS_DB_PASSWORD
  # 必须修改：填写随机长字符串，用于后端 JWT 签名。
  jwt-secret: &tms-jwt-secret "" # TMS_JWT_SECRET

services:
  mysql:
    # MySQL 8.0 官方镜像同时支持 AMD64 和 ARM64；从 5.7 升级前请先备份 ./data/mysql。
    image: mysql:8.0
    container_name: gost-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: *tms-db-password
      MYSQL_DATABASE: *tms-db-name
      MYSQL_USER: *tms-db-user
      MYSQL_PASSWORD: *tms-db-password
      MYSQL_PWD: *tms-db-password
      TZ: Asia/Shanghai
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./gost.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=1000
      --innodb_buffer_pool_size=256M
    networks:
      - gost-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--silent"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  backend:
    image: ghcr.io/planetsider/springboot-backend:latest
    container_name: springboot-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: *tms-db-name
      DB_USER: *tms-db-user
      DB_PASSWORD: *tms-db-password
      JWT_SECRET: *tms-jwt-secret
      LOG_DIR: /app/logs
      JAVA_OPTS: "-Xms256m -Xmx512m -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai"
    ports:
      # 可修改左侧宿主机端口；右侧 6365 是容器端口，不要修改。
      - "6365:6365" # TMS_BACKEND_PORT
    volumes:
      - ./logs/backend:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gost-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:6365/flow/test"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    image: ghcr.io/planetsider/vite-frontend:latest
    container_name: vite-frontend
    restart: unless-stopped
    ports:
      # 可修改左侧宿主机端口；右侧 80 是容器端口，不要修改。
      - "6366:80" # TMS_FRONTEND_PORT
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gost-network
networks:
  gost-network:
    name: gost-network
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        # 可选修改：仅在该 ULA 网段与其他 Docker/VPN 网络冲突时覆盖。
        - subnet: ${TMS_IPV6_SUBNET:-fd00:dead:beef::/48}
