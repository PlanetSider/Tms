name: release-node

# 节点正式发布:构建带 sing-box 子进程管理能力的 gost 二进制并发布 install.sh。
# 所有节点均通过面板生成的 install.sh 一键命令安装或更新。
# 触发:推送 gost-v* 标签(与面板 Docker 版本标签分开)。
#   git tag gost-v1 && git push origin gost-v1

on:
  push:
    tags:
      - 'gost-v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-gost/go.mod

      - name: Build hybrid gost (amd64 + arm64)
        working-directory: go-gost
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=mod -trimpath -ldflags "-s -w" -o ../dist/gost-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=mod -trimpath -ldflags "-s -w" -o ../dist/gost-arm64 .
          cp ../install.sh ../dist/install.sh
          ls -la ../dist

      # 先发 draft:action-gh-release 是「先建 release 再传 asset」,release 一建
      # latest 就立刻指向新 tag,而那会儿 30MB 的二进制还在传 —— 中间这一两分钟里
      # releases/latest/download/gost-amd64 是 404,正在装节点的人会莫名其妙地
      # 「下载失败」,而且看不出跟发版有关。draft 期间 latest 不动,传完再一次性放出来。
      - name: Publish release (draft first)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/gost-amd64
            dist/gost-arm64
            dist/install.sh
          body: |
            所有节点均通过面板「转发机监控」生成的一键命令安装或更新。
            安装命令会下载本 Release 的 install.sh，以及与节点架构匹配的
            gost-amd64 或 gost-arm64，并注册为 gost.service。

      # asset 全部就位后才真正发布并置为 latest,把上面那个 404 窗口彻底关掉
      - name: Flip draft to published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
